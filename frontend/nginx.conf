# =============================================================================
# NGINX CONFIGURATION FOR PROFILEMAIL FRONTEND
# =============================================================================
# This configuration:
# 1. Serves React static files (HTML, CSS, JS, images)
# 2. Handles SPA routing (returns index.html for frontend routes)
# 3. Proxies /api and /auth requests to the backend container
# 4. Enables gzip compression for faster loading
# 5. Sets proper caching headers for static assets
# =============================================================================

# Run as nginx user for security
user nginx;

# Auto-detect number of CPU cores for worker processes
worker_processes auto;

# Error log location
error_log /var/log/nginx/error.log warn;

# Process ID file
pid /var/run/nginx.pid;

# =============================================================================
# EVENTS CONFIGURATION
# =============================================================================
events {
    # Maximum simultaneous connections per worker
    worker_connections 1024;
}

# =============================================================================
# HTTP CONFIGURATION
# =============================================================================
http {
    # Include MIME types (so browser knows how to handle .js, .css, etc.)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # -------------------------------------------------------------------------
    # LOGGING FORMAT
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # PERFORMANCE OPTIMIZATIONS
    # -------------------------------------------------------------------------
    # Enable sendfile for efficient file serving
    sendfile on;
    
    # Keep connections alive for 65 seconds
    keepalive_timeout 65;

    # -------------------------------------------------------------------------
    # GZIP COMPRESSION
    # -------------------------------------------------------------------------
    # Compress responses to reduce bandwidth and improve load times
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # -------------------------------------------------------------------------
    # UPSTREAM BACKEND
    # -------------------------------------------------------------------------
    # Define the backend API server
    # "api" is the Docker service name from docker-compose.yml
    upstream backend {
        server api:8080;
    }

    # -------------------------------------------------------------------------
    # SERVER CONFIGURATION
    # -------------------------------------------------------------------------
    server {
        # Listen on port 80
        listen 80;
        server_name localhost;

        # Root directory for static files
        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------
        # API PROXY
        # ---------------------------------------------------------------------
        # Forward /api requests to Spring Boot backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # Pass original headers to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (if needed later)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts for large file uploads
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Allow large file uploads (100MB)
            client_max_body_size 100M;
        }

        # Forward /auth requests to Spring Boot backend
        location /auth/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward /actuator requests (health checks)
        location /actuator/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ---------------------------------------------------------------------
        # STATIC ASSETS WITH CACHING
        # ---------------------------------------------------------------------
        # Cache JS, CSS, and images for 1 year (they have content hashes)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---------------------------------------------------------------------
        # SPA FALLBACK (React Router Support)
        # ---------------------------------------------------------------------
        # For any route that doesn't match above, serve index.html
        # This allows React Router to handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ---------------------------------------------------------------------
        # SECURITY HEADERS
        # ---------------------------------------------------------------------
        # Prevent clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # Enable XSS filter in browsers
        add_header X-XSS-Protection "1; mode=block" always;

        # ---------------------------------------------------------------------
        # ERROR PAGES
        # ---------------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}

