# =============================================================================
# APPLICATION PROPERTIES - API PROFILE
# =============================================================================
# These settings are ONLY used when running with:
#   --spring.profiles.active=api
#
# The API profile:
# - Runs the HTTP server on port 8080
# - Handles REST endpoints (upload, auth, status)
# - Pushes jobs to Redis (producer)
# - Does NOT consume jobs from Redis (that's the worker's job)
# =============================================================================

# Server runs on port 8080
server.port=8080

# Disable the worker component in API profile
# The CSVJobConsumerService has @Profile("worker") so it won't start anyway
# This is just for clarity and any additional worker-related beans
app.worker.enabled=false

# Logging level for API
logging.level.com.archit.profilemail.controller=INFO
logging.level.com.archit.profilemail.service=INFO

