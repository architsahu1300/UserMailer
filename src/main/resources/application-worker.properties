# =============================================================================
# APPLICATION PROPERTIES - WORKER PROFILE
# =============================================================================
# These settings are ONLY used when running with:
#   --spring.profiles.active=worker
#
# The worker profile:
# - Does NOT run an HTTP server (no web endpoints)
# - Consumes jobs from Redis Stream
# - Downloads files from S3
# - Parses CSV and inserts into database
# - Sends notification emails
# =============================================================================

# Disable the web server - workers don't need HTTP endpoints
# This saves resources and startup time
spring.main.web-application-type=none

# Enable scheduling for the @Scheduled methods in CSVJobConsumerService
spring.main.allow-bean-definition-overriding=true

# Enable the worker component
app.worker.enabled=true

# Logging - more verbose for debugging worker issues
logging.level.com.archit.profilemail.service.worker=DEBUG
logging.level.com.archit.profilemail.service.upload=INFO

