# =============================================================================
# APPLICATION PROPERTIES - DEVELOPMENT PROFILE
# =============================================================================
# These settings are for local development on your machine.
# Run with: --spring.profiles.active=dev
#
# In dev mode:
# - Both API and Worker run in the same JVM (simpler for testing)
# - More verbose logging
# - Show SQL queries
# =============================================================================

# Server port for development
server.port=8080

# Enable both API and Worker in dev mode
app.worker.enabled=true

# Show SQL queries in console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Verbose logging
logging.level.com.archit.profilemail=DEBUG
logging.level.org.springframework.data.redis=DEBUG

# Use local Redis (default: localhost:6379)
spring.data.redis.host=localhost
spring.data.redis.port=6379

