# =============================================================================
# APPLICATION PROPERTIES - SHARED CONFIGURATION
# =============================================================================
# These settings are shared across ALL profiles (api, worker, dev).
# Profile-specific settings in application-{profile}.properties will override these.
#
# Environment Variable Pattern:
#   ${ENV_VAR_NAME:default_value}
#   - First tries to use the environment variable
#   - If not set, uses the default value after the colon
# =============================================================================

spring.application.name=ProfileMail

# -----------------------------------------------------------------------------
# DATABASE CONFIGURATION (PostgreSQL / Neon)
# -----------------------------------------------------------------------------
# In production (Docker), these come from environment variables
# In development, they use the defaults (your Neon database)

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-noisy-forest-a1u8yga2-pooler.ap-southeast-1.aws.neon.tech/architdb}
spring.datasource.username=${DATABASE_USERNAME:architdb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_3cXAUtq1QHwk}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool settings (important for production)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# -----------------------------------------------------------------------------
# REDIS CONFIGURATION
# -----------------------------------------------------------------------------
# Redis is used for the job queue (Redis Streams)

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Uncomment if your Redis requires authentication:
# spring.data.redis.password=${REDIS_PASSWORD:}

# -----------------------------------------------------------------------------
# BACKBLAZE B2 CONFIGURATION (S3-compatible storage)
# -----------------------------------------------------------------------------
# Where uploaded CSV files are stored

backblaze.endpoint=${BACKBLAZE_ENDPOINT:s3.us-east-005.backblazeb2.com}
backblaze.bucket=${BACKBLAZE_BUCKET:UserMailer-Uploaded-Files}
backblaze.access-key=${BACKBLAZE_ACCESS_KEY}
backblaze.secret-key=${BACKBLAZE_SECRET_KEY}

# -----------------------------------------------------------------------------
# SENDGRID CONFIGURATION (Email service)
# -----------------------------------------------------------------------------

sendgrid.api.key=${SENDGRID_API_KEY}

# -----------------------------------------------------------------------------
# SECURITY CONFIGURATION
# -----------------------------------------------------------------------------

# JWT secret for token signing (use a long random string in production!)
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-that-should-be-at-least-256-bits}

# Default user (for basic auth fallback - not used with JWT)
spring.security.user.name=${SECURITY_USER:archit}
spring.security.user.password=${SECURITY_PASSWORD:pass}
spring.security.user.roles=USER

# -----------------------------------------------------------------------------
# FILE UPLOAD CONFIGURATION
# -----------------------------------------------------------------------------
# Max file size for uploads

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# -----------------------------------------------------------------------------
# ACTUATOR CONFIGURATION (Health checks for Docker)
# -----------------------------------------------------------------------------
# Exposes /actuator/health endpoint for Docker healthcheck

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# -----------------------------------------------------------------------------
# SCHEDULING CONFIGURATION
# -----------------------------------------------------------------------------
# Required for @Scheduled annotations in the worker

spring.task.scheduling.pool.size=5
